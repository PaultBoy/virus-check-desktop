[workspace]
resolver = "3"
members = ["crates/vcd-core", "crates/vcd-cli", "crates/vcd-app"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true



