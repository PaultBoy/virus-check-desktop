[package]
name = "vcd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Static analysis core for Virus Check Desktop: digests, content typing, engine orchestration."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libloading = "0.8"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
yara-x = { version = "1.24", default-features = false, features = ["constant-folding", "fast-regexp", "exact-atoms"] }
